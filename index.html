<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Gaos &amp; Widya — Wedding Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--em:#2B7A63;--fo:#1F6A55;--sage:#A8B8A0;--gold:#C6A66B;--bg:#FAF8F2;--card:#fff;--tx:#1d2b25;--mut:#6b7a72;--ln:#e7e2d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a15;--card:#13261e;--tx:#ece8dc;--mut:#9fb0a6;--ln:#24402f}}
*{box-sizing:border-box}html{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;font-weight:600}
header{background:radial-gradient(90% 120% at 10% 0%,rgba(255,255,255,.2),transparent 60%),radial-gradient(70% 100% at 90% 100%,rgba(198,166,107,.18),transparent 65%),linear-gradient(125deg,#2F7D68,#3E8F78 50%,#2B7A63);color:#fff;padding:18px 20px 18px;border-bottom:2px solid var(--gold);border-radius:0 0 26px 26px;box-shadow:0 10px 26px rgba(6,78,59,.25)}
header h1{margin:0;font-size:24px;letter-spacing:.04em}header small{color:var(--gold);letter-spacing:.18em;font-size:11px;text-transform:uppercase}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;justify-content:space-between;gap:2px;width:min(94vw,460px);padding:6px;border-radius:28px;background:linear-gradient(120deg,rgba(58,138,115,.88),rgba(43,122,99,.88));backdrop-filter:blur(16px);border:1px solid var(--gold);box-shadow:0 12px 32px rgba(0,0,0,.3)}
nav button{flex:1;background:none;border:0;color:#cfe0d6;padding:6px 2px;cursor:pointer;font-size:11px;border-radius:22px;display:flex;flex-direction:column;align-items:center}nav button i{font-style:normal;font-size:20px}
nav button.on{background:var(--gold);color:#0B3D2E;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px 16px 130px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(6,78,59,.08);margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border-left:3px solid var(--gold)}.stat b{display:block;font:600 24px Georgia,serif;color:var(--em)}.stat span{color:var(--mut);font-size:12px}
@media(prefers-color-scheme:dark){.stat b{color:var(--gold)}}
.btn{background:var(--em);color:#fff;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px}.btn.g{background:none;color:var(--em);border:1px solid var(--em)}.btn.d{background:#9b2c2c}.btn.s{padding:4px 9px;font-size:12px}
@media(prefers-color-scheme:dark){.btn.g{color:var(--gold);border-color:var(--gold)}}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar input,.bar select{width:auto;flex:1 1 150px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}td,th{padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#eee;color:#444}.ok{background:#d7efe2;color:#064E3B}.wa{background:#f6ebcf;color:#7a5a12}.no{background:#f6d9d9;color:#8a2020}.in{background:#dce6f5;color:#244a82}
.pg{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--gold))}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.md{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}.fg label{font-size:12px;color:var(--mut)}.fg .w{grid-column:1/-1}@media(max-width:520px){.fg{grid-template-columns:1fr}}
.it{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 8px 24px rgba(6,78,59,.08);display:flex;gap:10px;flex-wrap:wrap;align-items:center}.it .m{flex:1;min-width:200px}.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13px}.meta small{color:var(--mut);margin-right:3px}.ac{display:flex;gap:6px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--gold);color:#0B3D2E;border:0;font-size:30px;box-shadow:0 10px 24px rgba(0,0,0,.3);cursor:pointer;z-index:7}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.tile{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;text-align:left;cursor:pointer;color:var(--tx);box-shadow:0 8px 24px rgba(6,78,59,.08);font:inherit}.tile i{font-style:normal;font-size:28px;display:block}.tile b{display:block}.tile small{color:var(--mut)}.help{color:var(--mut);margin:2px 0 12px;font-size:14px}
.tiles{grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:14px 14px 16px;border-radius:16px;box-shadow:none;border-top:2px solid var(--gold)}.tile i{display:none}.tile b{font:600 15px Georgia,serif;color:var(--em)}.tile small{font-size:12px}
header small{letter-spacing:.14em;font-size:10px}header h1{font-size:26px!important;letter-spacing:.14em!important;font-weight:500!important}h2{font-size:24px;letter-spacing:.02em;margin-bottom:2px}
.card,.it{box-shadow:0 2px 14px rgba(43,122,99,.07);border-radius:16px}nav button{white-space:nowrap}nav button i{display:block;line-height:0;padding:3px 0}
@media print{.fab{display:none}}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--em);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:10;border:1px solid var(--gold)}
.empty{text-align:center;color:var(--mut);padding:28px}.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row span:first-child{width:110px;font-size:13px}.row .pg{flex:1}
@media print{header,.bar,.btn,#toast{display:none!important}body{background:#fff;color:#000}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script></head><body>
<header><small>Wedding Management Dashboard</small><h1>GAOS &amp; WIDYA</h1><nav id="nav"></nav></header>
<main id="app"><div class="empty">Memuat data…</div></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+(+n||0).toLocaleString('id-ID'),uid=()=>Math.random().toString(36).slice(2,9);
const ST=['Belum','Proses','Selesai'],CATS=['VIP','Keluarga Pria','Keluarga Wanita','Teman','Sahabat','Rekan Kerja','Tetangga','Umum'];
const FC=['Catering','Dekorasi','Busana','MUA','Dokumentasi','Hiburan','Souvenir','Undangan','Perlengkapan','Lain-lain'];
const M={
checklist:{t:'Wedding Checklist',cols:['title','phase','pic','deadline','status'],f:[['title','Item','t'],['phase','Fase','s',['1 Prioritas Utama','2 Booking Vendor','3 Tim Hari H','4 Teknis Hari H']],['status','Status','s',ST],['pic','PIC'],['deadline','Deadline','date'],['vendor','Nama vendor'],['contact','Kontak'],['total','Harga total','n'],['dp','DP','n'],['pay','Tanggal pembayaran','date'],['detail','Detail persiapan / pesanan','a'],['helpers','Anggota yang membantu'],['notes','Catatan','a']]},
guests:{t:'Guest Management',cols:['name','cat','pax','invStatus','rsvp'],f:[['name','Nama tamu','t'],['partner','Pasangan / keluarga'],['cat','Kategori','s',CATS],['origin','Asal keluarga / relasi'],['wa','WhatsApp'],['addr','Alamat'],['pax','Jumlah orang','n'],['invType','Jenis undangan','s',['Digital','Cetak']],['invStatus','Status undangan','s',['Belum dikirim','Sudah dikirim','Sudah diterima']],['rsvp','Status RSVP','s',['Belum konfirmasi','Hadir','Tidak hadir','Masih menunggu']],['table','Meja / area'],['notes','Catatan','a']]},
vendors:{t:'Vendor Management',cols:['name','cat','contact','deal','status'],f:[['name','Nama vendor','t'],['cat','Kategori','s',['Catering','Tenda','MUA','Dekorasi','Dokumentasi','Hiburan','Busana','Undangan','Souvenir']],['contact','Nama kontak'],['wa','WhatsApp'],['addr','Alamat'],['offer','Harga penawaran','n'],['deal','Harga kesepakatan','n'],['dp','DP','n'],['paid','Pelunasan','n'],['book','Tanggal booking','date'],['work','Jadwal pengerjaan','date'],['status','Status vendor','s',['Kandidat','Negosiasi','Booked','Lunas']],['notes','Catatan','a']]},
finance:{t:'Budget & Finance',cols:['date','cat','desc','type','amount'],f:[['date','Tanggal','date'],['cat','Kategori','s',FC],['desc','Keterangan','t'],['type','Jenis','s',['DP','Pelunasan','Pengeluaran']],['amount','Jumlah (Rp)','n'],['notes','Catatan','a']]},
team:{t:'Team & PIC',cols:['name','wa','team','role','shift'],f:[['name','Nama anggota','t'],['wa','WhatsApp'],['team','Tim','s',['Penerima tamu','VIP','Catering','Souvenir','Parkir','Dokumentasi','Perlengkapan','Koordinator acara']],['role','Jabatan / PIC'],['task','Bagian tugas','a'],['helps','Anggota yang dibantu'],['shift','Jadwal bertugas'],['notes','Catatan','a']]},
rundown:{t:'Event Rundown',cols:['time','title','pic','place','status'],f:[['time','Waktu','time'],['title','Nama kegiatan','t'],['detail','Detail','a'],['pic','PIC'],['place','Lokasi'],['status','Status','s',ST],['notes','Catatan','a']]}};
const TPL=[[1,'Tanggal & Lokasi Acara'],[1,'Jumlah Undangan & Budget'],[1,'Berkas KUA / Catatan Sipil'],[2,'Catering'],[2,'Tenda & Busana Pengantin'],[2,'Rias Pengantin & Dekorasi'],[2,'Dokumentasi'],[2,'Hiburan'],[2,'Cincin Nikah, Mahar & Seserahan'],[2,'Undangan & Souvenir'],[3,'Seragam Keluarga & Panitia'],[3,'Daftar Tamu VIP'],[3,'Penerima Tamu'],[3,'Penunggu Catering (koordinator, shift, konsumsi keluarga/VIP/panitia)'],[3,'Koordinator Acara / PIC Hari H'],[4,'Rundown Acara Lengkap'],[4,'Keuangan & Pembayaran Vendor'],[4,'Kebutuhan Pribadi Pengantin'],[4,'Teknis Acara & Perlengkapan Lokasi'],[4,'Koordinasi Panitia & Keluarga'],[4,'Tamu & Penutupan Acara']];
const PH=['1 Prioritas Utama','2 Booking Vendor','3 Tim Hari H','4 Teknis Hari H'];
const D={settings:{}};let V='dash',Q={},refs={},loaded=0,cur=null;
const I=p=>`<svg width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>${p}</svg>`;
const TABS=[['dash','Beranda',I("<path d='M3 11l9-8 9 8M5 10v10h14V10'/>")],['checklist','Checklist',I("<path d='M4 12l5 5L20 6'/>")],['guests','Tamu',I("<circle cx='9' cy='8' r='3.5'/><path d='M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18.5 14.3c2 .6 3 2.4 3 5.7'/>")],['more','Lainnya',I("<path d='M4 7h16M4 12h16M4 17h10'/>")]];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2200)}
async function save(k){try{await refs[k].set({items:D[k]});toast('✓ Tersimpan')}catch(e){toast('Gagal menyimpan: '+(e.message||e.code))}}
const bcls=v=>/Selesai|Hadir$|check-in|Lunas|Booked|diterima|Digital/.test(v)&&!/Tidak|Belum/.test(v)?'ok':/Tidak/.test(v)?'no':/Belum|Kandidat/.test(v)?'wa':/Proses|Nego|Menunggu|Masih|dikirim/.test(v)?'in':'';
const bd=v=>v?`<span class="bd ${bcls(v)}">${esc(v)}</span>`:'';
function fmt(m,k,r){const f=M[m].f.find(x=>x[0]==k),v=r[k];if(k=='deal'||k=='amount'||f[2]=='n'&&/total|dp|offer|paid|deal|amount/.test(k))return rp(v);return f[2]=='s'&&['status','rsvp','att','invStatus','type'].includes(k)?bd(v):esc(v)}
function render(){
 $('#nav').innerHTML=TABS.map(([k,l,i])=>`<button class="${V==k||(k=='more'&&!TABS.some(t=>t[0]==V))?'on':''}" data-v="${k}"><i>${i}</i>${l}</button>`).join('');
 if(loaded<7){$('#app').innerHTML='<div class="empty">Memuat data…</div>';return}
 const a=$('#app');a.innerHTML=V=='dash'?dash():V=='more'?more():V=='finance'?finpage()+list('finance'):V=='checkin'?checkin():V=='reports'?reports():V=='settings'?settings():list(V);
}
function list(m){const c=M[m],q=(Q[m]||'').toLowerCase(),fl=Q[m+'f']||'',tk={finance:'desc'}[m]||c.f[0][0],H={checklist:'Daftar pekerjaan persiapan. Ketuk ✓ Selesai jika sudah beres.',guests:'Semua tamu undangan. Ketuk Edit untuk mengubah RSVP atau status undangan.',vendors:'Vendor yang dipakai. Tombol WA langsung membuka WhatsApp.',finance:'Catat setiap pembayaran: DP, pelunasan, atau pengeluaran lain.',team:'Keluarga dan panitia beserta tugasnya.',rundown:'Susunan acara hari H, urut berdasarkan jam.'};
 let rows=D[m].filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!fl||Object.values(r).includes(fl)));if(m=='rundown')rows=[...rows].sort((a,b)=>a.time>b.time?1:-1);
 const fo=m=='guests'?CATS:m=='checklist'?PH:m=='vendors'?M.vendors.f[1][3]:[];
 return `<h2 style="margin:0">${c.t}</h2><p class="help">${H[m]}</p><div class="bar"><input placeholder="🔍 Cari…" value="${esc(Q[m])}" data-q="${m}">${fo.length?`<select data-qf="${m}"><option value="">Semua</option>${fo.map(o=>`<option ${fl==o?'selected':''}>${o}</option>`).join('')}</select>`:''}<button class="btn g" data-exp="${m}">⬇ CSV</button>${m=='guests'?'<button class="btn g" data-imp>⬆ Import CSV</button><input type="file" id="imp" accept=".csv" hidden>':''}</div>`+(rows.length?rows.map(r=>`<div class="it"><div class="m"><b>${esc(r[tk])||'(tanpa judul)'}</b><div class="meta">${c.cols.filter(k=>k!=tk&&r[k]!==undefined&&r[k]!=='').map(k=>`<span><small>${c.f.find(x=>x[0]==k)[1]}</small>${fmt(m,k,r)}</span>`).join('')}</div></div><div class="ac">${m=='checklist'?`<button class="btn s" data-done="${r.id}">${r.status=='Selesai'?'↺ Buka lagi':'✓ Selesai'}</button>`:''}${r.wa?`<a class="btn s g" target="_blank" href="https://wa.me/${String(r.wa).replace(/\D/g,'').replace(/^0/,'62')}">💬 WA</a>`:''}<button class="btn s g" data-edit="${m}:${r.id}">Edit</button><button class="btn s d" data-del="${m}:${r.id}">Hapus</button></div></div>`).join(''):`<div class="card empty">${q||fl?'Tidak ada hasil.':'Belum ada data. Ketuk tombol <b>+</b> di kanan bawah untuk menambah.'}</div>`)+`<button class="fab" data-add="${m}" aria-label="Tambah">+</button>`}
function listOld(m){
 const c=M[m],q=(Q[m]||'').toLowerCase(),fl=Q[m+'f']||'';let rows=D[m].filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!fl||Object.values(r).includes(fl)));
 const fopts=m=='guests'?CATS:m=='checklist'?PH:m=='vendors'?M.vendors.f[1][3]:[];
 return `<div class="bar"><h2 style="margin:0;flex:1 1 100%">${c.t}</h2><input placeholder="Cari…" value="${esc(Q[m])}" data-q="${m}">${fopts.length?`<select data-qf="${m}"><option value="">Semua</option>${fopts.map(o=>`<option ${fl==o?'selected':''}>${o}</option>`).join('')}</select>`:''}<button class="btn" data-add="${m}">+ Tambah</button><button class="btn g" data-exp="${m}">Export CSV</button>${m=='guests'?'<button class="btn g" data-imp>Import CSV</button><input type="file" id="imp" accept=".csv" hidden>':''}</div>
 <div class="card tw">${rows.length?`<table><tr>${c.cols.map(k=>`<th>${c.f.find(x=>x[0]==k)[1]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${c.cols.map(k=>`<td>${fmt(m,k,r)}</td>`).join('')}<td style="white-space:nowrap">${m=='checklist'?`<button class="btn s g" data-done="${r.id}">${r.status=='Selesai'?'↺':'✓'}</button> `:''}${r.wa?`<a class="btn s g" target="_blank" href="https://wa.me/${String(r.wa).replace(/\D/g,'').replace(/^0/,'62')}">WA</a> `:''}<button class="btn s g" data-edit="${m}:${r.id}">Edit</button> <button class="btn s d" data-del="${m}:${r.id}">Hapus</button></td></tr>`).join('')}</table>`:`<div class="empty">Belum ada data. Tekan “+ Tambah” untuk mulai.</div>`}</div>`}
function form(m,id){const c=M[m],r=id?D[m].find(x=>x.id==id):{};cur={m,id};
 $('body').insertAdjacentHTML('beforeend',`<div class="ov" id="ov"><div class="md"><h3 style="margin-top:0">${id?'Edit':'Tambah'} — ${c.t}</h3><div class="fg">${c.f.map(([k,l,t,o])=>`<div class="${t=='a'||k=='title'||k=='name'?'w':''}"><label>${l}</label>${t=='a'?`<textarea name="${k}" rows="2">${esc(r[k])}</textarea>`:t=='s'?`<select name="${k}">${o.map(x=>`<option ${(r[k]||(k=='att'?'Belum hadir':''))==x?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${k}" type="${t=='n'?'number':t=='date'?'date':t=='time'?'time':'text'}" value="${esc(r[k]??(k=='pax'?1:''))}">`}</div>`).join('')}</div><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn g" data-x>Batal</button><button class="btn" data-ok>Simpan</button></div></div></div>`)}
async function submit(){const{m,id}=cur,r=id?D[m].find(x=>x.id==id):{id:uid()},o={};document.querySelectorAll('#ov [name]').forEach(e=>o[e.name]=e.type=='number'?+e.value||0:e.value.trim());
 const k0=M[m].f[0][0];if(!o[k0]&&m!='finance'){toast('Isi '+M[m].f[0][1]+' terlebih dahulu');return}
 if(m=='guests'&&D.guests.some(g=>g.id!=r.id&&g.name.toLowerCase()==o.name.toLowerCase()&&(g.wa||'')==o.wa)){toast('Tamu dengan nama & WA sama sudah ada');return}
 Object.assign(r,o);if(!id)D[m].push(r);$('#ov').remove();render();save(m)}
function checkin(){const q=(Q.ci||'').toLowerCase(),rows=q?D.guests.filter(g=>(g.name+g.partner+g.origin).toLowerCase().includes(q)).slice(0,15):[];
 const done=D.guests.filter(g=>g.att=='Sudah check-in');
 return `<h2>Check-in Tamu Hari H</h2><div class="card"><input placeholder="Ketik nama tamu…" value="${esc(Q.ci)}" data-q="ci" style="font-size:18px">${rows.map(g=>`<div class="row" style="border-bottom:1px solid var(--ln);padding:8px 0"><div style="flex:1"><b>${esc(g.name)}</b> ${esc(g.partner)}<br><small>${esc(g.cat)} · ${g.pax||1} orang · meja ${esc(g.table||'-')}</small></div>${g.att=='Sudah check-in'?`<span class="bd ok">✓ ${esc(g.ciAt||'')} (${g.actual} org)</span>`:`<button class="btn" data-ci="${g.id}">CHECK-IN</button>`}</div>`).join('')||(q?'<div class="empty">Tamu tidak ditemukan</div>':'<div class="empty">Cari nama tamu untuk check-in</div>')}</div>
 <div class="card"><b>Sudah check-in: ${done.length} undangan · ${done.reduce((s,g)=>s+(+g.actual||0),0)} orang</b>${done.slice(-8).reverse().map(g=>`<div style="font-size:13px">${esc(g.name)} — ${g.actual} org — ${esc(g.ciAt)} — oleh ${esc(g.ciBy)}</div>`).join('')}</div>`}
async function doCi(id){const g=D.guests.find(x=>x.id==id);if(g.att=='Sudah check-in'&&!await ask('Tamu ini sudah check-in. Tetap ubah datanya?'))return;
 let by='';try{by=localStorage.getItem('by')||''}catch(e){}
 const r=await new Promise(res=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md"><h3 style="margin-top:0">Check-in: ${esc(g.name)}</h3><label>Jumlah orang yang hadir</label><input id="cn" type="number" min="1" value="${g.pax||1}"><br><br><label>Nama petugas</label><input id="cb" value="${esc(by)}"><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn g" id="cx">Batal</button><button class="btn" id="cy">✓ Check-in</button></div></div>`;document.body.appendChild(o);o.querySelector('#cx').onclick=()=>{o.remove();res(null)};o.querySelector('#cy').onclick=()=>{const p=o.querySelector('#cb').value.trim();if(!p){toast('Isi nama petugas');return}const n=+o.querySelector('#cn').value||1;o.remove();res([n,p])}});
 if(!r)return;const[n,p]=r;try{localStorage.setItem('by',p)}catch(e){}

function parse(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'&&t[i+1]=='"'){c+='"';i++}else if(h=='"')q=0;else c+=h}else if(h=='"')q=1;else if(h==','||h==';'){r.push(c);c=''}else if(h=='\n'){r.push(c);R.push(r);r=[];c=''}else if(h!='\r')c+=h}if(c||r.length){r.push(c);R.push(r)}return R}
